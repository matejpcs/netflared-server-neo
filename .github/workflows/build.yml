name: Build NeoForge 1.20.x

on:
  push:
    branches: ["1.20.x"]
  pull_request:
    branches: ["1.20.x"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netflared-neoforge-1-20-x
  cancel-in-progress: true

jobs:
  build:
    name: NeoForge ${{ matrix.mc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: "1.20.1"
            neo: "20.1.121"
            java: "17"
          - mc: "1.20.2"
            neo: "20.2.88"
            java: "17"
          - mc: "1.20.3"
            neo: "20.3.8-beta"
            java: "17"
          - mc: "1.20.4"
            neo: "20.4.237"
            java: "17"
          - mc: "1.20.5"
            neo: "20.5.133"
            java: "21"
          - mc: "1.20.6"
            neo: "20.6.62-beta"
            java: "21"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "${{ matrix.java }}"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.3"
      - name: Build
        run: gradle clean build --no-daemon --stacktrace --refresh-dependencies -Pminecraft_version="${{ matrix.mc }}" -Pneo_version="${{ matrix.neo }}"
      - name: Verify JAR
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(build/libs/*.jar)
          test "${#jars[@]}" -gt 0
          printf '%s
' "${jars[@]}"
      - name: Upload JAR
        uses: actions/upload-artifact@v6
        with:
          name: netflared-neoforge-1-20-x
          path: build/libs/*.jar
          if-no-files-found: error
