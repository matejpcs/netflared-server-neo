name: Build NeoForge 1.21.x

on:
  push:
    branches: ["1.21.x"]
  pull_request:
    branches: ["1.21.x"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.1"
      - name: Build
        run: gradle clean build --no-daemon --stacktrace --refresh-dependencies -Pminecraft_version="1.21.11" -Pneo_version="21.11.25-beta"
      - name: Verify JAR
        run: test -n "$(find build/libs -maxdepth 1 -name '*.jar' -print -quit)"
      - uses: actions/upload-artifact@v6
        with:
          name: netflared-neo-1.21.11
          path: build/libs/*.jar
          if-no-files-found: error
