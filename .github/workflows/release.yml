name: Build & Release NeoForge compatibility bundles

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version
        required: true
        default: "0.1.12"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "NeoForge 1.20.6"
            ref: "1.20.x"
            mc: "1.20.6"
            neo: "20.6.62-beta"
            java: "21"
            gradle: "8.14.3"
            artifact: "netflared-neo-1.20.6"
          - label: "NeoForge 1.21.11"
            ref: "1.21.x"
            mc: "1.21.11"
            neo: "21.11.25-beta"
            java: "21"
            gradle: "9.5.1"
            artifact: "netflared-neo-1.21.11"
          - label: "NeoForge 26.2"
            ref: "26.x"
            mc: "26.2"
            neo: "26.2.0.87"
            java: "25"
            gradle: "9.7.1"
            artifact: "netflared-neo-26.2"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ matrix.gradle }}
      - name: Build
        run: gradle clean build --no-daemon --stacktrace --refresh-dependencies -Pmod_version="0.1.12" -Pminecraft_version="${{ matrix.mc }}" -Pneo_version="${{ matrix.neo }}"
      - name: Verify JAR
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(build/libs/*.jar)
          test "${#jars[@]}" -gt 0
          printf '%s\n' "${jars[@]}"
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: build/libs/*.jar
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: "v${{ inputs.release_version || '0.1.12' }}"
          name: "Netflared Server ${{ inputs.release_version || '0.1.12' }} — NeoForge"
          target_commitish: main
          generate_release_notes: true
          files: release/*.jar
