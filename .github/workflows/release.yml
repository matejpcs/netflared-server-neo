name: Build & Release NeoForge versions

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version
        required: true
        default: "0.1.13"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Release ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "NeoForge 1.20.6"
            ref: "1.20.x"
            mc: "1.20.6"
            neo: "20.6.62-beta"
            java: "21"
            gradle: "8.14.3"
          - label: "NeoForge 1.21.11"
            ref: "1.21.x"
            mc: "1.21.11"
            neo: "21.11.25-beta"
            java: "21"
            gradle: "9.5.1"
          - label: "NeoForge 26.2"
            ref: "26.x"
            mc: "26.2"
            neo: "26.2.0.87"
            java: "25"
            gradle: "9.7.1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ matrix.gradle }}
      - name: Build
        run: gradle clean build --no-daemon --stacktrace --refresh-dependencies -Pmod_version="${{ inputs.release_version }}" -Pminecraft_version="${{ matrix.mc }}" -Pneo_version="${{ matrix.neo }}"
      - name: Verify JAR
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(build/libs/*.jar)
          test "${#jars[@]}" -gt 0
          printf '%s\n' "${jars[@]}"
      - name: Release version
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "v${{ inputs.release_version }}-neo-${{ matrix.mc }}"
          name: "Netflared Server ${{ inputs.release_version }} — neo ${{ matrix.mc }}"
          target_commitish: ${{ matrix.ref }}
          generate_release_notes: false
          files: build/libs/*.jar
