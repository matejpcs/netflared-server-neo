name: Build & Release NeoForge all versions

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version
        required: true
        default: "0.1.13"

permissions:
  contents: write

jobs:
  build:
    name: Build NeoForge ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "1.20"
            group: "1.20"
          - version: "1.20.1"
            group: "1.20"
          - version: "1.20.2"
            group: "1.20"
          - version: "1.20.3"
            group: "1.20"
          - version: "1.20.4"
            group: "1.20"
          - version: "1.20.5"
            group: "1.20"
          - version: "1.20.6"
            group: "1.20"
          - version: "1.21"
            group: "1.21"
          - version: "1.21.1"
            group: "1.21"
          - version: "1.21.2"
            group: "1.21"
          - version: "1.21.3"
            group: "1.21"
          - version: "1.21.4"
            group: "1.21"
          - version: "1.21.5"
            group: "1.21"
          - version: "1.21.6"
            group: "1.21"
          - version: "1.21.7"
            group: "1.21"
          - version: "1.21.8"
            group: "1.21"
          - version: "1.21.9"
            group: "1.21"
          - version: "1.21.10"
            group: "1.21"
          - version: "1.21.11"
            group: "1.21"
          - version: "26.0"
            group: "26"
          - version: "26.1"
            group: "26"
          - version: "26.2"
            group: "26"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.version }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ startsWith(matrix.version, '26.') && '25' || ((matrix.version == '1.20.5' || matrix.version == '1.20.6' || startsWith(matrix.version, '1.21')) && '21' || '17') }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ matrix.group == '1.20' && '8.14.3' || matrix.group == '1.21' && '9.5.1' || '9.7.1' }}
      - name: Build
        env:
          VERSION: ${{ matrix.version }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          prefix=$(case "$VERSION" in
            1.20.*) echo "${VERSION#1.}";;
            1.21) echo "21.0";;
            1.21.*) echo "21.${VERSION##*.}";;
            26.*) echo "$VERSION";;
          esac)
          neo=$(curl -fsSL https://maven.neoforged.net/releases/net/neoforged/neoforge/ | grep -oE 'href="[0-9]+\.[0-9]+\.[0-9]+/"' | sed -E 's/href="([^"]+)"/\1/' | tr -d / | grep "^$prefix\." | sort -V | tail -1)
          test -n "$neo"
          gradle clean build --no-daemon --stacktrace --refresh-dependencies -Pmod_version="$RELEASE_VERSION" -Pminecraft_version="$VERSION" -Pneo_version="$neo"
          jar=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' | head -n1)
          test -n "$jar"
          cp "$jar" "netflared-server-neo-$VERSION.jar"
      - uses: actions/upload-artifact@v4
        with:
          name: neo-${{ matrix.version }}
          path: netflared-server-neo-${{ matrix.version }}.jar

  release:
    name: Release NeoForge ${{ matrix.group }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        group: ["1.20","1.21","26"]
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: neo-${{ matrix.group }}*
          path: grouped
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.release_version }}-neo-${{ matrix.group }}
          name: Netflared Server ${{ inputs.release_version }} — NeoForge ${{ matrix.group }}
          generate_release_notes: false
          files: grouped/*.jar
