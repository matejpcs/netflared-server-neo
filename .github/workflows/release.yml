name: Build & Release NeoForge all versions
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version
        required: true
        default: "0.1.13"
permissions:
  contents: write
  id-token: write
jobs:
  build:
    name: Build NeoForge ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "1.20.1"
            group: "1.20"
            java: "17"
            gradle: "8.8"
          - version: "1.20.2"
            group: "1.20"
            java: "17"
            gradle: "8.8"
          - version: "1.20.3"
            group: "1.20"
            java: "17"
            gradle: "8.8"
          - version: "1.20.4"
            group: "1.20"
            java: "17"
            gradle: "8.8"
          - version: "1.20.5"
            group: "1.20"
            java: "21"
            gradle: "8.8"
          - version: "1.20.6"
            group: "1.20"
            java: "21"
            gradle: "8.8"
          - version: "1.21"
            group: "1.21"
            java: "21"
            gradle: "9.5.1"
          - version: "1.21.1"
            group: "1.21"
            java: "21"
            gradle: "9.5.1"
          - version: "1.21.2"
            group: "1.21"
            java: "21"
            gradle: "9.5.1"
          - version: "1.21.3"
            group: "1.21"
            java: "21"
            gradle: "9.5.1"
          - version: "1.21.4"
            group: "1.21"
            java: "21"
            gradle: "9.5.1"
          - version: "1.21.5"
            group: "1.21"
            java: "21"
            gradle: "9.5.1"
          - version: "1.21.6"
            group: "1.21"
            java: "21"
            gradle: "9.5.1"
          - version: "1.21.7"
            group: "1.21"
            java: "21"
            gradle: "9.5.1"
          - version: "1.21.8"
            group: "1.21"
            java: "21"
            gradle: "9.5.1"
          - version: "1.21.9"
            group: "1.21"
            java: "21"
            gradle: "9.5.1"
          - version: "1.21.10"
            group: "1.21"
            java: "21"
            gradle: "9.5.1"
          - version: "1.21.11"
            group: "1.21"
            java: "21"
            gradle: "9.5.1"
          - version: "26.1"
            group: "26"
            java: "25"
            gradle: "9.5.1"
          - version: "26.1.1"
            group: "26"
            java: "25"
            gradle: "9.5.1"
          - version: "26.1.2"
            group: "26"
            java: "25"
            gradle: "9.5.1"
          - version: "26.2"
            group: "26"
            java: "25"
            gradle: "9.5.1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.version }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ matrix.gradle }}
      - name: Resolve NeoForge version
        id: deps
        env:
          VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          if [ "$VERSION" = "1.20.1" ]; then
            neo="1.20.1-47.1.106"
          else
            case "$VERSION" in
              1.20.*) prefix="${VERSION#1.}" ;;
              1.21) prefix="21.0." ;;
              1.21.*) prefix="21.${VERSION##*.}." ;;
              26.*) prefix="$VERSION." ;;
              *) echo "Unsupported NeoForge version: $VERSION"; exit 1 ;;
            esac
            neo="$(curl -fsSL 'https://maven.neoforged.net/releases/net/neoforged/neoforge/' |
              grep -oE 'href="[0-9][^"]+/"' |
              sed -E 's/href="([^"]+)"/\1/' |
              sed 's#/$##' |
              grep "^$prefix" |
              sort -V |
              tail -n1)"
            test -n "$neo"
          fi
          echo "neo=$neo" >> "$GITHUB_OUTPUT"
          echo "NeoForge for Minecraft $VERSION: $neo"
      - name: Build
        env:
          VERSION: ${{ matrix.version }}
          RELEASE_VERSION: ${{ inputs.release_version || '0.1.13' }}
          NEO_VERSION: ${{ steps.deps.outputs.neo }}
        run: |
          set -euo pipefail
          gradle clean build --no-daemon --stacktrace --refresh-dependencies -Pmod_version="$RELEASE_VERSION" -Pminecraft_version="$VERSION" -Pneo_version="$NEO_VERSION"
          jar="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*dev*' ! -name '*javadoc*' | head -n1)"
          test -n "$jar"
          cp "$jar" "netflared-server-neo-$VERSION.jar"
      - uses: actions/upload-artifact@v4
        with:
          name: neo-${{ matrix.version }}
          path: netflared-server-neo-${{ matrix.version }}.jar
  release:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: Release NeoForge ${{ matrix.group }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        group: ["1.20","1.21","26"]
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: neo-${{ matrix.group }}*
          path: grouped
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.release_version }}-neo-${{ matrix.group }}
          name: Netflared Server ${{ inputs.release_version }} — NeoForge ${{ matrix.group }}
          generate_release_notes: false
          files: grouped/*.jar

# CI validation trigger
