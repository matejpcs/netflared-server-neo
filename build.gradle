plugins { id 'java'; id 'net.neoforged.gradle.userdev' version '7.1.38' }
group='com.matejpcs.netflared'
version=project.findProperty('mod_version') ?: '0.1.7-SNAPSHOT'
def neo=project.findProperty('neo_version') ?: '20.6.62-beta'
def mc=project.findProperty('minecraft_version') ?: '1.20.6'
def neoSeries=neo.tokenize('.')[0..1].join('.')
def javaVersion = mc in ['1.20.5','1.20.6'] ? 21 : 17
java.toolchain.languageVersion=JavaLanguageVersion.of(javaVersion)
dependencies { implementation 'net.neoforged:neoforge:' + neo; implementation 'com.google.code.gson:gson:2.13.2' }
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8'; options.release=javaVersion }
processResources {
 inputs.properties(version:project.version, minecraft_version:mc, neoforge_version:neoSeries)
 filesMatching('META-INF/neoforge.mods.toml') { expand(version:project.version, minecraft_version:mc, neoforge_version:neoSeries) }
}
jar { archiveBaseName='netflared-server-neo' }
