plugins { id 'net.neoforged.moddev' version '2.0.42-beta' }
group='com.matejpcs.netflared'
version='0.1.4-SNAPSHOT'
def neo=project.findProperty('neo_version') ?: '21.11.25-beta'
java.toolchain.languageVersion=JavaLanguageVersion.of(21)
neoForge { version=neo }
dependencies { implementation 'com.google.code.gson:gson:2.13.2' }
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8'; options.release=21 }
jar { archiveBaseName='netflared-server-neo' }
