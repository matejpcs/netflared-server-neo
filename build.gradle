plugins {
    id 'java'
    id 'net.neoforged.moddev.legacyforge' version '2.0.141'
}
group = 'com.matejpcs.netflared'
version = project.findProperty('mod_version') ?: '0.1.13-SNAPSHOT'
def mc = project.findProperty('minecraft_version') ?: '1.20.1'
def neo = project.findProperty('neo_version') ?: '1.20.1-47.1.106'
def neoSeries = '47'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

legacyForge {
    enable {
        neoForgeVersion = neo
    }
    mods {
        netflared {
            sourceSet(sourceSets.main)
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}
processResources {
    inputs.properties(version: project.version, minecraft_version: mc, neoforge_version: neoSeries)
    filesMatching('META-INF/mods.toml') {
        expand(version: project.version, minecraft_version: mc, neoforge_version: neoSeries)
    }
}
jar {
    archiveBaseName = 'netflared-server-neo'
}
